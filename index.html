<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="robots" content="noindex, nofollow">
  <title>Shresht Sharma | 3S Group</title>
  <meta name="description" content="Shresht Sharma at 3S Group. The full profile is being prepared.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--gold:#d1a354;--ink:#0b0b0b;--soft:#d4d0c9}
    *{box-sizing:border-box}html{min-height:100%}
    body{min-height:100vh;margin:0;font-family:Poppins,Arial,sans-serif;color:#fff;background:radial-gradient(circle at 80% 18%,#29241a 0,transparent 35%),var(--ink)}
    .page{min-height:100vh;width:min(1180px,calc(100% - 48px));margin:auto;display:flex;flex-direction:column}
    header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:34px 0}
    .brand img{display:block;width:116px;height:auto}.brand-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
    main{flex:1;display:flex;align-items:center;padding:80px 0 110px}.content{max-width:840px}
    .eyebrow{margin:0 0 24px;color:var(--gold);font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(52px,9vw,112px);line-height:.98;letter-spacing:-.065em;font-weight:600}
    .rule{width:76px;height:2px;background:var(--gold);margin:38px 0 28px}
    .intro{max-width:560px;margin:0;color:var(--soft);font-size:clamp(16px,2vw,20px);line-height:1.65}
    .button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;margin-top:38px;color:var(--ink);background:var(--gold);text-decoration:none;font-size:13px;font-weight:600}
    .button:hover,.button:focus-visible{background:#e4bb75}
    footer{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:24px 0;border-top:1px solid #36322b;color:#a9a49c;font-size:11px}
    footer a{color:var(--gold);text-decoration:none}footer a:hover,footer a:focus-visible{text-decoration:underline}
    @media(max-width:600px){.page{width:calc(100% - 36px)}header{padding:24px 0}.brand img{width:88px}.brand-label{font-size:9px;text-align:right}main{padding:86px 0 100px}h1{font-size:clamp(50px,13vw,72px)}footer{align-items:flex-start;flex-direction:column;gap:8px}}
  </style>
</head>
<body>
  <div class="page">
    <header><a class="brand" href="https://3sgroupme.com/" aria-label="Visit 3S Group"><img src="assets/3s-group-logo.png" alt="3S Group"></a><span class="brand-label">Dubai, United Arab Emirates</span></header>
    <main><div class="content"><p class="eyebrow">3S Group</p><h1>Shresht<br>Sharma.</h1><div class="rule" aria-hidden="true"></div><p class="intro">A dedicated profile is being prepared. Explore the 3S Group while this page takes shape.</p><a class="button" href="https://3sgroupme.com/">Explore 3S Group</a></div></main>
    <footer><span>Shresht Sharma · 3S Group</span><a href="https://3sgroupme.com/">3sgroupme.com</a></footer>
  </div>
</body>
</html>
